name: macOS ARM64
on:
  push:
    paths:
      - 'macos-arm64/**'
      - '.github/workflows/macos-arm64.yml'
  pull_request:
    paths:
      - 'macos-arm64/**'
      - '.github/workflows/macos-arm64.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and build USB tool
        run: |
          bash -n mini.sh
          sh -n src/install-spotify.sh
          clang -arch arm64 -O2 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -framework IOKit -framework CoreFoundation src/mini-usb.c -o "${RUNNER_TEMP}/mini-usb"
          file "${RUNNER_TEMP}/mini-usb" | grep arm64
          ./mini.sh --help
