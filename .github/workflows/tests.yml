name: Test Station Mini Root
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Load bundled native USB runtime
        shell: python
        run: |
          import ctypes
          import sys
          from pathlib import Path
          import libusb_package
          sys.path.insert(0, str(Path.cwd()))
          library = libusb_package.get_library_path()
          assert library is not None and library.is_file(), 'Packaged libusb is missing'
          native = ctypes.CDLL(str(library))
          native.libusb_get_version.restype = ctypes.c_void_p
          assert native.libusb_get_version(), 'libusb version API failed'
          print('Native libusb load and version API PASS:', library)
          # Linux cloud runners have no usable USB host. Full context creation
          # is checked on both frozen release binaries by scripts/build-app.py.
          if sys.platform == 'win32':
              from station_mini_root import check_usb
              code = check_usb('usb-report.json')
              print(Path('usb-report.json').read_text(encoding='utf-8'))
              raise SystemExit(code)

