name: Test Station Mini Root
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Load USB runtime without opening devices
        shell: python
        env:
          PYUSB_DEBUG: debug
        run: |
          import logging
          import sys
          import ctypes
          import subprocess
          import libusb_package
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from station_mini_root import check_usb
          logging.basicConfig(level=logging.DEBUG)
          library = libusb_package.get_library_path()
          print('Packaged library:', library, flush=True)
          if sys.platform == 'linux':
              subprocess.run(['ldd', str(library)], check=True)
              print('USB filesystem present:', Path('/dev/bus/usb').exists(), flush=True)
          ctypes.CDLL(str(library))
          code = check_usb('usb-report.json')
          print(Path('usb-report.json').read_text(encoding='utf-8'))
          raise SystemExit(code)
